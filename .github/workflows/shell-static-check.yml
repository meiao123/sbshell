name: Shell static checks and behavioural tests

on:
  push:
    branches: [main, 'security-release-*']
  pull_request:
    branches: [main, 'security-release-*']

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              echo "sh -n $file"
              sh -n "$file"
            fi
          done < <(find . -type f -name '*.sh' -print0)
      - name: Validate JSON templates
        shell: bash
        run: |
          set -euo pipefail
          for f in config_template/*.json config_template/server/*.json; do
            echo "jq empty $f"
            jq empty "$f"
          done
      - name: Verify update source is main
        shell: bash
        run: |
          set -euo pipefail
          files=(sbshall.sh debian/menu.sh debian/update_scripts.sh openwrt/menu.sh openwrt/update_scripts.sh)
          ! grep -nE 'BASE_REF|RELEASE_REF|RELEASE_DECL_URL|resolve_release_ref' "${files[@]}"
          ! grep -nE "download_repo_file ['\"]?RELEASE|['\"]RELEASE['\"]" "${files[@]}"
          grep -q '"main"' sbshall.sh
          grep -q 'main/openwrt/' openwrt/menu.sh
          grep -q '"main"' openwrt/update_scripts.sh
          grep -q 'main/debian' debian/menu.sh
          grep -q 'main/debian' debian/update_scripts.sh
          test ! -e RELEASE
      - name: Run ShellCheck (errors, blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
      - name: Run ShellCheck (warnings, non-blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        continue-on-error: true
        with:
          scandir: .
          severity: warning

  behavioural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Run containerised behavioural tests
        shell: bash
        run: |
          set -uo pipefail
          bash tests/run.sh > /tmp/suite.log 2>&1
          rc=$?
          # Actions 的作业日志过长时只保留开头，失败断言会看不到；
          # 这里把输出尾部同时以内联注解暴露（可用 API /annotations 精准读取）。
          if [ "$rc" -ne 0 ]; then
            tail -25 /tmp/suite.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          else
            tail -5 /tmp/suite.log
          fi
          exit "$rc"
