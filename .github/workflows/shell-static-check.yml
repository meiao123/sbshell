name: Shell static checks and behavioural tests

on:
  push:
    branches: [main, 'security-release-*']
  pull_request:
    branches: [main, 'security-release-*']

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              echo "sh -n $file"
              sh -n "$file"
            fi
          done < <(find . -type f -name '*.sh' -print0)
      - name: Validate JSON templates
        shell: bash
        run: |
          set -euo pipefail
          for f in config_template/*.json config_template/server/*.json; do
            echo "jq empty $f"
            jq empty "$f"
          done
      - name: Verify the pinned release ref exists
        shell: bash
        run: |
          set -euo pipefail
          # 2026-09-11 的事故：BASE_REF/RELEASE_REF 指向的分支被删除，
          # 一键安装与脚本自更新全部 404，而离线行为测试无法发现。
          #
          # 只能用 raw URL（脚本真正消费的路径）来验证引用是否存在：
          #   * `git ls-remote <repo> <sha>` 只匹配引用名，对 40 位提交 SHA 恒为 rc=2，
          #     会把每一次合法的 SHA 固定都判成失败；
          #   * `git fetch --depth=1 <sha>` 虽然判定正确（不可达时报
          #     `upload-pack: not our ref`），但会把当前检出变成 shallow 仓库、截断历史，
          #     是有副作用的检查，不适合放在 CI 的检出里。
          # raw CDN 对刚推送的提交可能有秒级延迟，故重试 3 次。
          upstream=meiao123/sbshell
          refs=$(grep -hoE '(BASE_REF|RELEASE_REF)=[^ ]+' sbshall.sh debian/menu.sh debian/update_scripts.sh openwrt/menu.sh openwrt/update_scripts.sh | cut -d= -f2 | sort -u)
          for ref in $refs; do
            echo "checking ref: $ref"
            ok=0
            for attempt in 1 2 3; do
              if curl -fsS --max-time 20 -o /dev/null \
                "https://raw.githubusercontent.com/$upstream/$ref/debian/menu.sh"; then
                ok=1; break
              fi
              echo "attempt $attempt failed for $ref, retrying"
              sleep 3
            done
            [ "$ok" -eq 1 ] || {
              echo "::error::发布引用不存在: $ref（请固定到已推送到 $upstream 的提交 SHA）"; exit 1; }
          done
          # 发布声明文件：更新脚本按它解析"当前发布提交"，内容必须是单个可下载的不可变 SHA。
          echo "checking RELEASE declaration"
          declared=$(curl -fsS --max-time 20 "https://raw.githubusercontent.com/$upstream/refs/heads/main/RELEASE" | tr -d '\r\n')
          printf '%s' "$declared" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error::RELEASE 声明不是 40 位提交 SHA: '$declared'"; exit 1; }
          curl -fsS --max-time 20 -o /dev/null "https://raw.githubusercontent.com/$upstream/$declared/debian/menu.sh" || {
            echo "::error::RELEASE 指向的提交无法下载: $declared"; exit 1; }
      - name: Run ShellCheck (errors, blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
      - name: Run ShellCheck (warnings, non-blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        continue-on-error: true
        with:
          scandir: .
          severity: warning

  behavioural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Run containerised behavioural tests
        shell: bash
        run: |
          set -uo pipefail
          bash tests/run.sh > /tmp/suite.log 2>&1
          rc=$?
          # Actions 的作业日志过长时只保留开头，失败断言会看不到；
          # 这里把输出尾部同时以内联注解暴露（可用 API /annotations 精准读取）。
          if [ "$rc" -ne 0 ]; then
            tail -25 /tmp/suite.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          else
            tail -5 /tmp/suite.log
          fi
          exit "$rc"
