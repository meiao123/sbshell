name: Shell static checks and behavioural tests

on:
  push:
    branches: [main, 'security-release-*']
  pull_request:
    branches: [main, 'security-release-*']

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              echo "sh -n $file"
              sh -n "$file"
            fi
          done < <(find . -type f -name '*.sh' -print0)
      - name: Validate JSON templates
        shell: bash
        run: |
          set -euo pipefail
          for f in config_template/*.json config_template/server/*.json; do
            echo "jq empty $f"
            jq empty "$f"
          done
      - name: Run ShellCheck (errors, blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
      - name: Run ShellCheck (warnings, non-blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        continue-on-error: true
        with:
          scandir: .
          severity: warning

  behavioural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run containerised behavioural tests
        shell: bash
        run: bash tests/run.sh
