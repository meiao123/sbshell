name: Shell static checks and behavioural tests

on:
  push:
    branches: [main, 'security-release-*']
  pull_request:
    branches: [main, 'security-release-*']

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              echo "sh -n $file"
              sh -n "$file"
            fi
          done < <(find . -type f -name '*.sh' -print0)
      - name: Validate JSON templates
        shell: bash
        run: |
          set -euo pipefail
          for f in config_template/*.json config_template/server/*.json; do
            echo "jq empty $f"
            jq empty "$f"
          done
      - name: Verify the pinned release ref exists
        shell: bash
        run: |
          set -euo pipefail
          # 2026-09-11 的事故：BASE_REF/RELEASE_REF 指向的分支被删除，
          # 一键安装与脚本自更新全部 404，而离线行为测试无法发现。
          refs=$(grep -hoE '(BASE_REF|RELEASE_REF)=[^ ]+' sbshall.sh debian/menu.sh debian/update_scripts.sh openwrt/menu.sh openwrt/update_scripts.sh | cut -d= -f2 | sort -u)
          for ref in $refs; do
            echo "checking ref: $ref"
            git ls-remote --exit-code origin "$ref" >/dev/null || {
              echo "::error::发布引用不存在: $ref（请固定到存在的提交 SHA）"; exit 1; }
          done
      - name: Run ShellCheck (errors, blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
      - name: Run ShellCheck (warnings, non-blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        continue-on-error: true
        with:
          scandir: .
          severity: warning

  behavioural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Run containerised behavioural tests
        shell: bash
        run: bash tests/run.sh
