name: Shell static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              echo "sh -n $file"
              sh -n "$file"
            fi
          done < <(find . -type f -name '*.sh' -print0)
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning
