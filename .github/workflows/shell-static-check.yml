name: Shell static checks and behavioural tests

on:
  # security-release-* 分支早已删除，保留它只会让触发器与现状不符。
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # 同一分支连续推送时取消仍在跑的旧工作流：避免两个作业同时写同一 runner 资源，
  # 也让 PR 的检查结果始终对应最新提交。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 动作固定到提交 SHA（tag 可被上游移动到其它提交）。下同。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              echo "sh -n $file"
              sh -n "$file"
            fi
          done < <(find . -type f -name '*.sh' -print0)
      - name: Validate JSON templates
        shell: bash
        run: |
          set -euo pipefail
          for f in config_template/*.json; do
            echo "jq empty $f"
            jq empty "$f"
          done
      - name: Verify update source is main
        shell: bash
        run: |
          set -euo pipefail
          files=(sbshall.sh openwrt/menu.sh openwrt/update_scripts.sh)
          ! grep -nE 'BASE_REF|RELEASE_REF|RELEASE_DECL_URL|resolve_release_ref' "${files[@]}"
          ! grep -nE "download_repo_file ['\"]?RELEASE|['\"]RELEASE['\"]" "${files[@]}"
          grep -q '"main"' sbshall.sh
          # openwrt/menu.sh 的下载体已改成 download_repo_file "openwrt/$s" "main"，
          # 字面量 "main/openwrt/" 不复存在：改为断言“下载 ref 是 main”。
          grep -qE 'download_repo_file "openwrt/[^"]*" "main"' openwrt/menu.sh
          grep -q '"main"' openwrt/update_scripts.sh
          test ! -e RELEASE
      - name: Run ShellCheck (errors, blocking)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: error
      - name: Run ShellCheck (warnings, non-blocking)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        continue-on-error: true
        with:
          scandir: .
          severity: warning

  behavioural:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 动作固定到提交 SHA（tag 可被上游移动到其它提交）。下同。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run containerised behavioural tests
        shell: bash
        run: |
          set -uo pipefail
          # Actions 的 `shell: bash` 自带 -e：旧写法里 `bash tests/run.sh …` 一旦失败就
          # 立刻结束这一步，下面的 rc=$? 和 tail 永远执行不到，失败原因只留在
          # /tmp/suite.log 里（注解也没生成），CI 只报 "Process completed with exit code 1"。
          rc=0
          bash tests/run.sh > /tmp/suite.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::行为测试失败（rc=$rc）"
            # 逐条失败断言也做成注解：Actions 的**作业日志**只保留开头，而注解接口很小，
            # 所以只发一个标题等于没有可诊断信息（这一条就是这么暴露出来的）。
            grep -nE '  FAIL |^########## .* FAILED|个套件失败|没有输出小结行' /tmp/suite.log \
              | head -n 10 | while IFS= read -r line; do
                  echo "::error::$line"
                done || true
            echo "----- 套件小结与失败断言 -----"
            grep -nE '^########## |^-- [0-9]+ checks|  FAIL ' /tmp/suite.log || true
          fi
          tail -40 /tmp/suite.log
          exit "$rc"
      - name: Upload behavioural test log
        # 这一步必须 always()：失败时的日志才是唯一线索（容器 --rm 会丢掉所有 /tmp/*.out），
        # 而 Actions 的界面只保留日志开头，artifactId 才能拿到完整套件输出。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behavioural-suite-log
          path: /tmp/suite.log
          if-no-files-found: warn
