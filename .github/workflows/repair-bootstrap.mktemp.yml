name: Repair bootstrap portability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix(openwrt): repair downloader portability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Patch BusyBox downloader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('sbshall.sh'), Path('openwrt/menu.sh'), Path('openwrt/update_scripts.sh')]
          for path in files:
              text = path.read_text()
              if path.name != 'sbshall.sh' and path.parent.name == 'openwrt' and 'REPO_RAW=' not in text:
                  marker = 'BASE_REF=7dfddbae21d224349bb4ba4ac2d81bd541d39b9d\n'
                  if marker not in text:
                      raise SystemExit(f'missing BASE_REF marker in {path}')
                  text = text.replace(marker, marker + 'REPO_RAW="https://raw.githubusercontent.com/meiao123/sbshell"\n', 1)
              text = text.replace('mktemp /tmp/sbshell-archive.XXXXXX.tar.gz', 'mktemp /tmp/sbshell-archive.XXXXXX', 1)
              path.write_text(text)

          test = Path('tests/suites/08_archive_fallback.sh')
          text = test.read_text()
          extra = "    assert_grep 'mktemp /tmp/sbshell-archive\\.XXXXXX([^A-Za-z0-9]|$)' \"$SBSHELL_SRC/$f\" \"$f 使用 BusyBox 兼容的 mktemp 模板\"\n"
          if extra not in text:
              text = text.replace("    assert_grep 'tar' \"$SBSHELL_SRC/$f\" \"$f 能从 archive 提取文件\"\n", "    assert_grep 'tar' \"$SBSHELL_SRC/$f\" \"$f 能从 archive 提取文件\"\n" + extra)
          test.write_text(text)
          PY
          bash -n sbshall.sh
          bash -n openwrt/menu.sh
          bash -n openwrt/update_scripts.sh
          bash -n tests/suites/08_archive_fallback.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git add sbshall.sh openwrt/menu.sh openwrt/update_scripts.sh tests/suites/08_archive_fallback.sh .github/workflows/repair-bootstrap.mktemp.yml
          git rm .github/workflows/repair-bootstrap.mktemp.yml
          git commit -m 'fix(openwrt): repair downloader portability'
          git push
